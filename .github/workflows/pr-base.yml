name: PR base

on:
  pull_request_target:
    types: [opened, reopened]
    branches-ignore: [release]

concurrency:
  group: pr-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  retarget:
    name: Retarget onto release
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Move the pull request to release
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          gh pr edit "$NUMBER" --base release

          echo "Retargeted #$NUMBER onto \`release\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          header: pr-base
          message: |
            **Retargeted this onto `release`.**

            `release` is the repository's integration and production branch.

            If the diff shows commits already on `release`, rebase and force-push:

            ```sh
            git fetch origin release
            git rebase origin/release
            git push --force-with-lease
            ```
